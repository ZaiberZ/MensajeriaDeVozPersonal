<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contactos frecuentes</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #162033;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #d9e1ef;
            flex: 0 0 auto;
            padding: 10px 24px;
        }

        header p {
            font-size: 14px;
            margin: 4px 0 0;
        }

        main {
            display: grid;
            flex: 1 1 auto;
            gap: 20px;
            grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
            min-height: 0;
            overflow: hidden;
            padding: 24px;
        }

        section {
            background: #ffffff;
            border: 1px solid #d9e1ef;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            overflow: hidden;
            padding: 18px;
        }

        h1, h2 {
            margin: 0;
        }

        h1 {
            font-size: 20px;
        }

        h2 {
            font-size: 18px;
            margin-bottom: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }

        input {
            border: 1px solid #c8d3e4;
            border-radius: 6px;
            flex: 1;
            font-size: 15px;
            min-width: 220px;
            padding: 10px;
        }

        button, a.button {
            align-items: center;
            background: #165dff;
            border: 0;
            border-radius: 6px;
            color: #ffffff;
            cursor: pointer;
            display: inline-flex;
            font-size: 14px;
            justify-content: center;
            padding: 10px 14px;
            text-decoration: none;
        }

        button.secondary, a.button.secondary {
            background: #edf2fb;
            color: #162033;
        }

        button.danger {
            background: #d92d20;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .list {
            align-content: start;
            display: grid;
            flex: 1 1 auto;
            gap: 10px;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 8px 6px 8px 0;
            scrollbar-color: #aab8cc #f4f7fb;
            scrollbar-gutter: stable;
            scrollbar-width: thin;
        }

        .list::-webkit-scrollbar {
            width: 10px;
        }

        .list::-webkit-scrollbar-track {
            background: #f4f7fb;
            border-radius: 999px;
        }

        .list::-webkit-scrollbar-thumb {
            background: #aab8cc;
            border: 2px solid #f4f7fb;
            border-radius: 999px;
        }

        .list::-webkit-scrollbar-thumb:hover {
            background: #7f91aa;
        }

        .item {
            align-items: center;
            border: 1px solid #e2e8f3;
            border-radius: 8px;
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr auto;
            padding: 12px;
        }

        .item.selected {
            border-color: #165dff;
            box-shadow: 0 0 0 2px rgba(22, 93, 255, .12);
        }

        .item.favorite {
            border-color: #e0a800;
            box-shadow: inset 3px 0 0 #e0a800;
        }

        .item.favorite.selected {
            border-color: #165dff;
            box-shadow: inset 3px 0 0 #e0a800, 0 0 0 2px rgba(22, 93, 255, .12);
        }

        .item:focus {
            border-color: #165dff;
            outline: 3px solid rgba(22, 93, 255, .22);
            outline-offset: 2px;
        }

        .name {
            font-weight: 700;
        }

        .phone {
            color: #506078;
            font-size: 14px;
            margin-top: 3px;
            word-break: break-word;
        }

        .message {
            color: #506078;
            margin-top: 10px;
            min-height: 20px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .alias-editor {
            display: grid;
            gap: 8px;
            margin-bottom: 14px;
        }

        .alias-row {
            display: grid;
            gap: 8px;
            grid-template-columns: minmax(0, 1fr) auto;
        }

        .alias-row input {
            min-width: 0;
            width: auto;
        }

        .alias-toolbar {
            display: flex;
            margin-bottom: 14px;
        }

        .aliases {
            color: #506078;
            font-size: 13px;
            margin-top: 3px;
        }

        .contact-editor[hidden] {
            display: none;
        }

        @media (max-width: 800px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            main {
                grid-template-columns: 1fr;
                min-height: auto;
                overflow: visible;
                padding: 14px;
            }

            section {
                min-height: 420px;
                overflow: hidden;
            }

            .list {
                max-height: 52vh;
                min-height: 220px;
            }

        }
    </style>
</head>
<body>
    <header>
        <h1>Contactos frecuentes</h1>
        <p><a href="/app-status">Volver al estado del Gateway</a></p>
    </header>

    <main>
        <section>
            <h2>Contactos de WhatsApp</h2>
            <div class="toolbar">
                <input id="search" type="search" placeholder="Buscar por nombre o telefono">
                <button id="loadContacts">Cargar contactos</button>
                <button id="addFrequent" class="secondary" disabled>Agregar a frecuentes</button>
            </div>
            <div id="whatsappContacts" class="list"></div>
            <div id="whatsappMessage" class="message"></div>
        </section>

        <section>
            <h2>Frecuentes guardados</h2>
            <div class="toolbar">
                <button id="refreshFrequent" class="secondary">Actualizar</button>
            </div>
            <div id="frequentEditor" class="contact-editor" hidden>
                <div class="toolbar">
                    <input id="frequentName" type="text" maxlength="100" placeholder="Nombre del contacto favorito">
                </div>
                <div id="frequentAliases" class="alias-editor"></div>
                <div class="actions alias-toolbar">
                    <button id="addFrequentAlias" class="secondary" type="button">Agregar nombre alternativo</button>
                    <button id="saveFrequentName" type="button">Guardar nombres</button>
                    <button id="cancelFrequentEdit" class="secondary" type="button">Cancelar</button>
                </div>
            </div>
            <div id="frequentContacts" class="list" style="margin-top:14px"></div>
            <div id="frequentMessage" class="message"></div>
        </section>
    </main>

    <script src="/contacts.js"></script>
</body>
</html>
